name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmlittlefs
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/dmlittlefs.dmf
          test -f build/dmf/dmlittlefs_version.txt
          test -f build/dmf/test_dmlittlefs.dmf
          test -f build/dmf/mklittlefs.dmf
          echo "Module files present"

      # dmlittlefs uses the 64-bit file API (Dmod_FileSeek/_FileTell/_FileSize
      # 2.0, dmod#312). The dmod_loader in the 1.0.4 image predates it, so
      # the tests run in one built from the same dmod develop the module
      # is built against. Cloned into a fresh directory: the image already
      # has a /tmp/dmod of its own.
      - name: Build dmod_loader from dmod develop
        run: |
          DMOD_SRC=$(mktemp -d)
          git clone --depth 1 --recursive -b develop https://github.com/choco-technologies/dmod.git "$DMOD_SRC"
          cmake -S "$DMOD_SRC" -B "$DMOD_SRC/build" -DDMOD_MODE=DMOD_SYSTEM \
            -DDMOD_BUILD_EXAMPLES=ON -DDMOD_BUILD_TESTS=OFF
          cmake --build "$DMOD_SRC/build" --target dmod_loader
          echo "DMOD_LOADER=$DMOD_SRC/build/examples/system/dmod_loader/dmod_loader" >> $GITHUB_ENV

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          dmf-get install -d ${DMOD_DMF_DIR}/test_dmlittlefs-local.dmd -y
          ${DMOD_LOADER} build/dmf/test_dmlittlefs.dmf
